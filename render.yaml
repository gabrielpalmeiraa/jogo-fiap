services:
  - type: web
    name: sinapse-protocolo-silencioso
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # preencher no painel do Render, nunca no repositório
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAX_GPT_CALLS_PER_SESSION
        value: "40"
